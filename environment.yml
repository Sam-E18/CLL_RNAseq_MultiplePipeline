# =============================================================
# Conda environment for Pipeline 3: Scanpy + pyDESeq2 + diffxpy
#
# Usage:
#   conda env create -f environment.yml
#   conda activate ieo_rnaseq
#
# To update after changes:
#   conda env update -f environment.yml --prune
# =============================================================
name: ieo_rnaseq
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - scanpy>=1.10
  - anndata>=0.10
  - pandas>=2.0
  - numpy>=1.24
  - matplotlib>=3.7
  - seaborn>=0.12
  - scipy>=1.11
  - scikit-learn>=1.3
  - leidenalg
  - umap-learn
  - jupyter
  - jupyterlab
  - ipykernel
  - pip
  - pip:
    - pydeseq2>=0.4
    - diffxpy>=0.7
    - gseapy>=1.1
    - adjustText
